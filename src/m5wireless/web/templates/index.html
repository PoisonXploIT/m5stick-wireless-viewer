<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e15" />
    <meta
      name="description"
      content="Dashboard de monitorizacion inalambrica en tiempo real para dispositivos ESP32 (Bruce, Marauder, Evil-M5Project)."
    />
    <title>m5wireless — dashboard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e15'/%3E%3Cpath d='M6 19a10 10 0 0 1 20 0' stroke='%2358a6ff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M10.5 19a5.5 5.5 0 0 1 11 0' stroke='%2358a6ff' stroke-width='2.4' fill='none' stroke-linecap='round' opacity='.6'/%3E%3Ccircle cx='16' cy='21' r='2.2' fill='%233fb950'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
            <path d="M6 19a10 10 0 0 1 20 0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            <path d="M10.5 19a5.5 5.5 0 0 1 11 0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity="0.6" />
            <circle cx="16" cy="21" r="2.4" fill="#3fb950" />
          </svg>
        </span>
        m5wireless
      </h1>
      <span id="conn-status" class="status status-offline" title="Estado de la fuente">
        fuente: —
      </span>
      <span id="sse-status" class="status status-offline">SSE: desconectado</span>
    </header>

    <section class="stats" aria-label="Contadores">
      <div class="stat">
        <div class="stat-top">
          <span class="stat-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M5 12.5a10 10 0 0 1 14 0" /><path d="M8.5 16a5.5 5.5 0 0 1 7 0" /><circle cx="12" cy="19" r="1.3" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="stat-label">redes</span>
        </div>
        <span class="stat-value" id="count-networks" aria-live="polite">0</span>
        <span class="stat-spark" id="spark-networks" title="Redes vistas en los últimos 10 min"></span>
      </div>
      <div class="stat">
        <div class="stat-top">
          <span class="stat-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="7" width="18" height="12" rx="2" /><path d="M7 11h.01M11 11h.01M15 11h.01M7 15h10" />
            </svg>
          </span>
          <span class="stat-label">clientes</span>
        </div>
        <span class="stat-value" id="count-clients" aria-live="polite">0</span>
        <span class="stat-spark" id="spark-clients" title="Clientes vistos en los últimos 10 min"></span>
      </div>
      <div class="stat">
        <div class="stat-top">
          <span class="stat-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 17V9M9 17V5M14 17v-7M19 17V7" />
            </svg>
          </span>
          <span class="stat-label">fuente</span>
        </div>
        <span class="stat-value stat-value-small" id="meta-source">—</span>
      </div>
    </section>

    <section class="filters" aria-label="Filtros">
      <input
        id="filter-text"
        class="filter-input"
        type="search"
        placeholder="Buscar SSID / BSSID"
        autocomplete="off"
      />
      <select id="filter-channel" class="filter-select" aria-label="Filtro por canal">
        <option value="">Canal: todos</option>
      </select>
      <input
        id="filter-rssi"
        class="filter-input filter-input-narrow"
        type="number"
        min="-100"
        max="0"
        placeholder="RSSI mín."
      />
      <label class="filter-toggle">
        <input type="checkbox" id="filter-clients" />
        solo con clientes
      </label>
    </section>

    <div id="filter-chips" class="chips" aria-label="Filtros activos"></div>

    <main class="grid">
      <section class="panel" aria-label="Redes">
        <div class="table-wrap">
          <table id="networks-table">
            <thead>
              <tr>
                <th data-key="ssid" scope="col"><button type="button" class="sort-btn">SSID</button></th>
                <th data-key="bssid" scope="col"><button type="button" class="sort-btn">BSSID</button></th>
                <th data-key="channel" scope="col"><button type="button" class="sort-btn">Canal</button></th>
                <th data-key="rssi" scope="col"><button type="button" class="sort-btn">RSSI</button></th>
                <th data-key="n_clients" scope="col"><button type="button" class="sort-btn">Clientes</button></th>
                <th data-key="last_seen" scope="col"><button type="button" class="sort-btn">Última vista</button></th>
              </tr>
            </thead>
            <tbody id="networks-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel console-panel" aria-label="Consola serial">
        <div class="panel-head">
          <h2>Consola serial</h2>
          <div class="panel-actions">
            <button type="button" id="console-pause" class="btn btn-sm" title="Pausar el streaming">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M9 5v14M15 5v14" />
              </svg>
              <span id="console-pause-label">Pausar</span>
              <span id="console-pending" class="badge" hidden></span>
            </button>
            <button type="button" id="console-clear" class="btn btn-sm" title="Vaciar la consola">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" />
              </svg>
              Limpiar
            </button>
            <button type="button" id="console-copy" class="btn btn-sm" title="Copiar el contenido">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
              </svg>
              Copiar
            </button>
          </div>
        </div>
        <div id="console" class="console" aria-live="off"></div>
      </section>

      <section class="panel channels-panel" aria-label="Distribución por canal">
        <h2>Distribución por canal</h2>
        <div class="channels-band">
          <h3 class="channels-band-title">2.4 GHz</h3>
          <ul id="channels-24" class="channels"></ul>
        </div>
        <div class="channels-band">
          <h3 class="channels-band-title">5 GHz</h3>
          <ul id="channels-5" class="channels"></ul>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a class="btn btn-primary" href="/api/export/csv" download>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M4 19h16" />
        </svg>
        Export CSV
      </a>
      <a class="btn" href="/api/export/json" download>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M4 19h16" />
        </svg>
        Export JSON
      </a>
      <a class="btn btn-ghost" href="/api/health">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12h4l2 6 4-14 2 8h6" />
        </svg>
        Health
      </a>
    </footer>

    <script src="/static/js/dashboard.js" defer></script>
  </body>
</html>
