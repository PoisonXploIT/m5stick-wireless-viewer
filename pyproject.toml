[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m5stick-wireless-viewer"
version = "3.0.2"
description = "Dashboard y pipeline de datos para firmwares de hardware hacking WiFi en ESP32 (Marauder, Evil-M5Project, ...)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PoisonXploIT" }]
dependencies = []

[project.scripts]
m5wireless = "m5wireless.cli:main"

[project.optional-dependencies]
# pyserial es opcional: solo lo necesita la fuente serial en vivo (host nativo).
# El paquete se importa y funciona sin el (FileSource, stores, parsers, API...).
serial = ["pyserial>=3"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
splunk = ["httpx>=0.27"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyserial>=3",
    "types-pyserial",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/m5wireless"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI exige Depends()/Query() como default de argumentos.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
