[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m5stick-wireless-viewer"
version = "3.0.0a1"
description = "Dashboard y pipeline de datos para firmwares de hardware hacking WiFi en ESP32 (Marauder, Evil-M5Project, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PoisonXploIT" }]
dependencies = []

[project.optional-dependencies]
# pyserial es opcional: solo lo necesita la fuente serial en vivo (host nativo).
# El paquete se importa y funciona sin el (FileSource, stores, parsers, API...).
serial = ["pyserial>=3"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyserial>=3", "types-pyserial"]

[tool.hatch.build.targets.wheel]
packages = ["src/m5wireless"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
